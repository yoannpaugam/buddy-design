name: Déployer sur GitHub Pages

# Publie l'app et rafraîchit les vrais événements de Nantes :
# - à chaque push sur main,
# - automatiquement toutes les 6 heures (collecte des agendas open data),
# - à la demande (onglet Actions → Run workflow).
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Collecter les événements et les lieux (open data Nantes Métropole, OpenStreetMap, OpenAgenda)
        run: npm run ingest
        env:
          PREVIOUS_URL: https://yoannpaugam.github.io/buddy-design/data/events.json
          PREVIOUS_PLACES_URL: https://yoannpaugam.github.io/buddy-design/data/places.json
          OPENAGENDA_KEY: ${{ secrets.OPENAGENDA_KEY }}
      - name: Résumé de la collecte
        run: |
          {
            echo "### Collecte des événements"
            echo '```json'
            cat public/data/ingest-report.json | head -c 4000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
