name: probe-donnees
on:
  push:
    branches: [ingest-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/ingest/run.mjs
      - run: |
          mkdir -p probe/run && cp public/data/ingest-report.json probe/run/ && cp public/data/events.json probe/run/
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe/run && git commit -m "probe: résultat de collecte [skip ci]" && git push
